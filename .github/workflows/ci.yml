# CI / Deploy workflow for Blue Horizon AI Concierge.
#
# On every push to main that touches relevant directories:
#   1. Detect which path groups changed.
#   2. If blue_horizon/, eval/, ui/, or tests/ changed: run the pytest unit
#      test suite (no secrets required, `db_integration`-marked tests
#      excluded).
#   3. If eval/ or blue_horizon/ changed: reset the shared Development Neon
#      branch, then run the `db_integration`-marked tests against it (role
#      privileges, write_ops, and API-level behavior that need a real
#      Postgres). This runs before the eval job below, sequenced by `needs:`,
#      so the two never mutate the same branch concurrently.
#   4. If eval/ or blue_horizon/ changed and step 3 passed or was skipped:
#      run the 23-case smoke eval and compare aggregated metric scores
#      against the pinned baseline. Reuses the same Development branch and
#      resets it again first, since eval cases assume a clean baseline.
#   5. If blue_horizon/, deploy/, assets/, ui/, Dockerfile, pyproject.toml,
#      or poetry.lock changed, and unit tests, the DB-integration tests, and
#      the eval each either passed or were skipped: push the repo to the
#      HuggingFace Docker Space so HF rebuilds the container automatically.
#
# Required repository/environment secrets (CI environment):
#   LANGSMITH_API_KEY   – LangSmith API key for dataset loading and tracing.
#   GEMINI_API_KEY      – Google Gemini API key for the agent, judge, and Ragas.
#   OPENAI_API_KEY      – OpenAI API key for the information agent and embeddings.
#   NEON_API_KEY        – Neon management API key for branch reset.
#   PGSQL_RW_EVAL_DB_URL – Read-write (bh_agent_rw) PostgreSQL connection string
#                          for the Development database. Reused by the
#                          db-integration-tests job as PGSQL_RW_DB_URL.
#   PGSQL_RO_EVAL_DB_URL – Read-only (bh_agent_ro) PostgreSQL connection string
#                          for the Development database. Reused by the
#                          db-integration-tests job as PGSQL_RO_DB_URL.
#   PGSQL_ROOT_EVAL_DB_URL – Schema-owner PostgreSQL connection string for the
#                          Development database. Reused by the
#                          db-integration-tests job as PGSQL_ROOT_DB_URL, for
#                          the one test in test_db_invariants.py that needs
#                          DDL privilege (temporarily dropping
#                          booking_rooms_no_overlap inside a rolled-back
#                          transaction -- bh_agent_rw cannot). Optional: that
#                          test skips gracefully if this is unset. Distinct
#                          from PGSQL_ROOT_PARENT_DB_URL, which
#                          booking_pgsql.reload_sql_tables reads and which
#                          must only ever point at the Parent branch, never
#                          Development.
#   REDIS_URL           – Redis connection URL for the agent's cache.
#   HF_TOKEN            – HuggingFace write token (Settings → Access Tokens).
#
# Required repository/environment variables (CI environment):
#   LANGSMITH_TRACING   – Set to "true" to enable LangSmith tracing.
#   LANGCHAIN_PROJECT   – LangSmith project name for trace grouping.
#   HF_SPACE            – HuggingFace Space identifier, e.g. "username/blue-horizon".

name: CI / Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "eval/**"
      - "blue_horizon/**"
      - "deploy/**"
      - "assets/**"
      - "ui/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "poetry.lock"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      unit_tests: ${{ steps.filter.outputs.unit_tests }}
      eval: ${{ steps.filter.outputs.eval }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            unit_tests:
              - 'blue_horizon/**'
              - 'deploy/generate_secrets.py'
              - 'eval/**'
              - 'ui/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'poetry.lock'
            eval:
              - 'eval/**'
              - 'blue_horizon/**'
            deploy:
              - 'blue_horizon/**'
              - 'deploy/**'
              - 'assets/**'
              - 'ui/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'poetry.lock'

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.unit_tests == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - run: git lfs pull --include="assets/"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "eval/requirements.txt"

      - name: Install dependencies
        run: |
          pip install assets/ml_dtypes-0.4.1-cp313-cp313-linux_x86_64.whl
          pip install -r eval/requirements.txt

      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379
          PGSQL_RW_DB_URL: postgresql://user:pass@localhost/db
          PGSQL_RO_DB_URL: postgresql://user:pass@localhost/db
        run: python -m pytest tests/ -m "not db_integration" -q

  db-integration-tests:
    name: DB-backed tests (Development branch)
    needs: changes
    if: needs.changes.outputs.eval == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: CI

    steps:
      - uses: actions/checkout@v5
      - run: git lfs pull --include="assets/"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "eval/requirements.txt"

      - name: Install dependencies
        run: |
          pip install assets/ml_dtypes-0.4.1-cp313-cp313-linux_x86_64.whl
          pip install -r eval/requirements.txt

      # Runs before the `eval` job (see `needs:` there) so the two never
      # reset or write to the shared Development branch concurrently.
      - name: Reset Development branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          python -m eval.booking_db_manager \
            --project-id orange-art-94985227 --branch-name Development

      - name: Run DB-backed tests
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PGSQL_RW_DB_URL: ${{ secrets.PGSQL_RW_EVAL_DB_URL }}
          PGSQL_RO_DB_URL: ${{ secrets.PGSQL_RO_EVAL_DB_URL }}
          PGSQL_ROOT_DB_URL: ${{ secrets.PGSQL_ROOT_EVAL_DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pytest tests/ -m db_integration -q

  eval:
    name: Smoke eval (23 cases)
    needs: [changes, db-integration-tests]
    if: |
      always() &&
      (needs.changes.outputs.eval == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.db-integration-tests.result == 'success' || needs.db-integration-tests.result == 'skipped')
    runs-on: ubuntu-latest
    environment: CI

    steps:
      - uses: actions/checkout@v5
      - run: git lfs pull --include="assets/"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "eval/requirements.txt"

      - name: Install dependencies
        run: |
          pip install assets/ml_dtypes-0.4.1-cp313-cp313-linux_x86_64.whl
          pip install -r eval/requirements.txt

      - name: Run smoke eval
        env:
          
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          LANGCHAIN_PROJECT: ${{ vars.LANGCHAIN_PROJECT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PGSQL_RW_EVAL_DB_URL: ${{ secrets.PGSQL_RW_EVAL_DB_URL }}
          PGSQL_RO_EVAL_DB_URL: ${{ secrets.PGSQL_RO_EVAL_DB_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python -m eval.run_experiment --config eval/eval_config_23.toml

      - name: Check results against baseline
        run: |
          RESULTS_DIR=$(ls -dt eval/outputs/hotel-agent-eval-23_*/ 2>/dev/null | head -1)
          if [ -z "$RESULTS_DIR" ]; then
            echo "ERROR: No eval output directory found." >&2
            exit 1
          fi
          python -m eval.ci_check "${RESULTS_DIR}results.jsonl"

      - name: Upload eval logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-logs-23
          path: eval/logs/
          if-no-files-found: ignore

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-results-23
          path: eval/outputs/
          if-no-files-found: ignore

  deploy:
    name: Push to HuggingFace Space
    needs: [changes, unit-tests, db-integration-tests, eval]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.db-integration-tests.result == 'success' || needs.db-integration-tests.result == 'skipped') &&
      (needs.eval.result == 'success' || needs.eval.result == 'skipped')
    runs-on: ubuntu-latest
    environment: CI

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - run: git lfs pull --include="assets/"

      - name: Push snapshot to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          MAIN_SHA=$(git rev-parse --short HEAD)
          git checkout --orphan hf-deploy
          # Exclude data/: it's LFS-tracked but never pulled above (only
          # assets/ is), and the Dockerfile never COPYs it (see
          # .dockerignore -- resets are done via Neon branches instead).
          # Staging it here would make `git push` try to upload LFS
          # objects that were never fetched locally, failing with
          # "Git LFS upload failed: (missing) ...".
          git add -A -- . ':!data'
          git commit -m "Deploy from main@${MAIN_SHA}"
          git push space hf-deploy:main --force
