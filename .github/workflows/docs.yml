# Build and publish the MkDocs documentation site to GitHub Pages.
#
# The Pages source must be set to "GitHub Actions" in the repository settings
# (Settings -> Pages -> Build and deployment -> Source), not to a branch.
#
# mkdocstrings reads the Python source statically via griffe rather than
# importing it, so this workflow installs only the docs dependency group --
# no runtime dependencies, no API keys, no database.

name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "blue_horizon/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it, so Pages is
# never left mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # Default shallow clone is fine: no git-history-dependent plugins are
      # enabled (edit_uri only builds URLs, it does not read history).
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Upper bounds mirror pyproject.toml's docs group. MkDocs 2.0 removes the
      # plugin system outright, which would break mkdocstrings and the Material
      # theme with no migration path, so an unpinned install here is a build
      # that breaks on release day with no change on our side.
      - name: Install docs dependencies
        run: pip install "mkdocs<2" "mkdocs-material<10" "mkdocstrings[python]<1"

      - name: Build
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
