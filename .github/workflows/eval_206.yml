# Full 206-case evaluation workflow for Blue Horizon AI Concierge.
#
# Triggered manually via the GitHub Actions "Run workflow" button.
# Results are uploaded to LangSmith and compared against the 206-case baseline.
#
# Secrets this workflow reads, all scoped to the Testing environment:
#   LANGSMITH_API_KEY    - LangSmith API key for dataset loading and tracing.
#   GEMINI_API_KEY       - Google Gemini API key for the agent, judge, and Ragas.
#   OPENAI_API_KEY       - OpenAI API key for the information agent and embeddings.
#   PGSQL_RW_EVAL_DB_URL - Read-write (bh_agent_rw) PostgreSQL connection string
#                          for the eval database.
#   PGSQL_RO_EVAL_DB_URL - Read-only (bh_agent_ro) PostgreSQL connection string
#                          for the eval database.
#   REDIS_URL            - Redis connection URL for the agent's cache.
#
# NEON_API_KEY (branch reset) is repository level rather than environment scoped.
# It is the only secret both the Testing and Production environments need, and a
# second copy would have to be rotated in two places, which is how copies drift.
#
# LANGSMITH_TRACING and LANGCHAIN_PROJECT are not secret and differ per eval
# workflow, so they are set in the job's env: block below rather than stored as
# environment variables. That keeps Testing purely about secret access.

name: Eval (206 cases)

on:
  workflow_dispatch:

jobs:
  eval:
    name: Full eval (206 cases)
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - uses: actions/checkout@v5
      - run: git lfs pull --include="assets/"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "eval/requirements.txt"

      - name: Install dependencies
        run: |
          pip install assets/ml_dtypes-0.4.1-cp313-cp313-linux_x86_64.whl
          pip install -r eval/requirements.txt

      - name: Run full eval
        env:
          # Not secret, and the value differs per eval workflow, so it is set
          # here rather than as an environment variable. That keeps the Testing
          # environment purely about which secrets a job may read.
          LANGSMITH_TRACING: "false"
          LANGCHAIN_PROJECT: github-evals-full
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PGSQL_RW_EVAL_DB_URL: ${{ secrets.PGSQL_RW_EVAL_DB_URL }}
          PGSQL_RO_EVAL_DB_URL: ${{ secrets.PGSQL_RO_EVAL_DB_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python -m eval.run_experiment --config eval/eval_config_206.toml

      - name: Check results against baseline
        run: |
          RESULTS_DIR=$(ls -dt eval/outputs/hotel-agent-eval-206_*/ 2>/dev/null | head -1)
          if [ -z "$RESULTS_DIR" ]; then
            echo "ERROR: No eval output directory found." >&2
            exit 1
          fi
          python -m eval.ci_check "${RESULTS_DIR}results.jsonl" \
            --baseline eval/baselines/hotel_agent_eval_206_baseline.json

      - name: Upload eval logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-logs-206
          path: eval/logs/
          if-no-files-found: ignore

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-results-206
          path: eval/outputs/
          if-no-files-found: ignore
