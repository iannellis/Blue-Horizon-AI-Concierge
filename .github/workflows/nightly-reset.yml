# Nightly Production reset for Blue Horizon AI Concierge.
#
# Runs on a schedule, once a day. Two things happen, in this order:
#   1. Reset the Production Neon branch to its parent baseline, replenishing
#      room availability that the day's demo bookings used up.
#   2. Restart the HuggingFace Space, so the in-process state that has no
#      TTL (MemorySaver history, thread-to-customer bindings, confirmed
#      proposal results) is cleared together with the database instead of
#      drifting out of sync with it. See
#      docs/design-decisions.md and AGENTS.md's module-boundaries note on
#      in-process state lifecycle.
#
# The restart step below has a side effect worth relying on deliberately: it
# forces the Space's process to restart, and startup_check() opens real
# database connections during init, so Neon's 24-hour archive clock never
# expires and the branch cannot archive out from under the live process. The
# reset step above does not provide this by itself: eval.neon.reset_branch
# only calls Neon's management API (branch lookup, restore, operation
# polling) and never opens a database connection, confirmed by watching an
# archived branch stay archived through two resets and only unarchive on a
# real connection. See docs/architecture/orchestration.md#readiness for why
# an archived branch is a startup-time concern (absorbed by the unbounded
# init retry loop and the 503 readiness gate) rather than a request-time
# one, and why that decision depends on this job actually running every
# night.
#
# A dead man's switch (https://healthchecks.io or equivalent) is pinged on
# success, and explicitly on failure too. This is the piece neither a failed
# GitHub Actions run (which already emails on its own) nor an in-Space job
# can provide: proof that the job was invoked at all. Two things silently
# stop a schedule: GitHub disables `cron:`-triggered workflows in public
# repositories after 60 days with no repository activity, and this repo is
# public; and a rotated/expired NEON_API_KEY could make a step a silent
# no-op depending on how it fails. A watchdog that expects a daily ping and
# alerts on its absence catches both.
#
# Secrets this job reads:
#   NEON_API_KEY         - Neon management API key for the branch reset. This one
#                          is repository level rather than environment scoped: it
#                          is the only secret both the Testing and Production
#                          environments need, and a second copy would have to be
#                          rotated in two places, which is how the copies drift.
#   HF_TOKEN             - HuggingFace write token, for the Space restart.
#                          Production environment.
#   HEALTHCHECK_PING_URL - Dead man's switch ping URL (healthchecks.io or
#                          equivalent). Production environment. Not a repo
#                          constant: anyone who can read a public workflow file
#                          can ping it, and a forged success ping would defeat
#                          its purpose, so it is kept a secret rather than
#                          hardcoded here.
#
# Variables this job reads:
#   HF_SPACE - HuggingFace Space identifier, e.g. "username/blue-horizon".
#              Production environment.

name: Nightly Production reset

on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC daily - late night / early morning across US time zones,
    # to land the restart during low demo traffic.
    - cron: "0 9 * * *"

jobs:
  nightly-reset:
    name: Reset Production branch and restart Space
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v5
      - run: git lfs pull --include="assets/"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "eval/requirements.txt"

      - name: Install dependencies
        run: |
          pip install assets/ml_dtypes-0.4.1-cp313-cp313-linux_x86_64.whl
          pip install -r eval/requirements.txt

      - name: Reset Production branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          python -m eval.booking_db_manager \
            --project-id orange-art-94985227 --branch-name Production

      # Sequenced after the reset, never before: the fresh process must
      # start against the already-reset database, not race it.
      - name: Restart HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          space = os.environ["HF_SPACE"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.restart_space(repo_id=space)
          print(f"Restart requested for {space}.")
          PY

      - name: Ping healthcheck (success)
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 3 \
            "$HEALTHCHECK_PING_URL"

      - name: Ping healthcheck (failure)
        if: failure()
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 3 \
            "$HEALTHCHECK_PING_URL/fail"
