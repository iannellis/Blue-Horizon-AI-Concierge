# Unified configuration for the Blue Horizon agents.
# Secrets (redis/pgsql) are still injected via environment variables; this file only holds tunables.

# Orchestration configuration for blue_horizon/agents/orchestration.py
# Notes
# - Secrets (API keys, Redis/DB URLs) are read from environment variables.
# - Timeouts are in seconds unless otherwise noted.

[orchestration.llm]
# Model identifier passed to ChatOpenAI
model = "gpt-5-mini"
# Sampling temperature
temperature = 0.0
# Reasoning effort hint for reasoning models (passed as reasoning={"effort": ...})
# Typical values: "minimal", "low", "medium", "high"
reasoning_effort = "low"
# Per-request network timeout for the LLM client
timeout_s = 15.0
# Retry count for transient provider/network errors
max_retries = 2

[orchestration.orchestration]
# Initialization retry policy for dependency startup
init_retry_base_s = 2.0
init_retry_max_s = 60.0
# Wall-clock cap for the router node (wraps the router LLM call)
router_timeout_s = 30.0
# Wall-clock cap for the info node (wraps the info LLM call)
info_timeout_s = 60
# Wall-clock cap for the rooms node (wraps the rooms LLM call)
rooms_timeout_s = 60
# Maximum concurrent LLM pipeline executions. Prevents token-per-minute
# exhaustion under high concurrency (e.g. stress tests, production traffic spikes).
llm_concurrency = 15

[orchestration.prompts]
# Folder (relative to blue_horizon package root) containing prompt files
folder = "system_prompts"
# Router system prompt filename within the prompts folder
orchestration_prompt_filename = "orchestration.txt"

[orchestration.messages]
# User-facing message when the router explicitly chooses "refuse"
refusal = "I'm sorry, I cannot help with that query. I can only provide information about the hotel and help with room bookings."
# User-facing message when an internal error occurs (router failure, parsing failure, etc.)
error = "Sorry - there was a problem processing your request. Please try again in a minute."
# User-facing message when the system is still initializing or temporarily unavailable
unavailable = "Sorry - the system isn't available at the moment. Please try again shortly."

# Single source of truth for all tunables used by the hotel RAG agent.
# Keep this section under version control, and override secrets via env vars (e.g. REDIS_URL).
[info.retrieval]
# Number of candidates to retrieve per source tool call (faq/amenities/services) and return overall.
top_k = 4
# Embedding dimensionality used by your Redis vector field schema.
# Must match the index schema in Redis (validated at startup via FT.INFO).
vector_dims = 1536
# Max number of cached retrievers (amenities/services) per process.
# This prevents filter-combo explosions from eating RAM.
retriever_cache_max = 64

[info.embeddings]
# OpenAI embedding model used by LlamaIndex Settings.embed_model.
model = "text-embedding-3-small"
# Batch size for embedding calls (tradeoff: throughput vs memory/latency).
batch_size = 64
# Network timeout for embedding requests (seconds). Keep bounded.
timeout_s = 20.0
# Max retries for embedding requests (small, to avoid request pileups under load).
max_retries = 2

[info.llm]
# Chat model used by LangChain ChatOpenAI.
model = "gpt-5.2"
# Temperature for responses (0 is deterministic-ish).
temperature = 0.0
# Reasoning effort. Medium works well for information agent.
reasoning_effort = "medium"
# Network timeout for chat requests (seconds).
timeout_s = 20.0
# Max retries for chat requests.
max_retries = 2

[info.redis]
# Redis connection timeout (seconds).
connect_timeout_s = 2.0
# Redis socket timeout (seconds). Bounds slow ops.
socket_timeout_s = 4.0
# Redis client health check interval (seconds).
health_check_interval_s = 30
# Retry count for transient Redis failures.
retry_max_retries = 2
# Base backoff (seconds) for Redis retries.
retry_backoff_base_s = 0.1
# Maximum backoff (seconds) for Redis retries.
retry_backoff_max_s = 1.0

[info.prompts]
# Folder (relative to blue_horizon package root) containing prompt files
folder = "system_prompts"
# File name ONLY (no path). The code assumes all prompts live in one folder.
system_prompt_filename = "information.txt"

# Non-secret configuration for the Rooms Agent.
[rooms.llm]
# Chat model name.
model = "gpt-5.2"
# 0.0 is best for deterministic SQL generation.
temperature = 0.0
# OpenAI reasoning effort hint (if supported by your model).
reasoning_effort = "low"
# Network timeout for LLM requests (seconds).
timeout_s = 20.0
# Max retries for LLM requests.
max_retries = 2

[rooms.prompts]
# Folder (relative to blue_horizon package root) containing prompt files
folder = "system_prompts"
# Prompt template filename inside the folder.
system_prompt_filename = "rooms.txt"

[rooms.agent]
# The default number of rooms to return to the user
top_k = 4

[rooms.db.pool]
# App-side pool. Even with Neon pooler this provides sane backpressure.
# min_size=0: don't proactively hold connections; open on demand only.
min_size = 0
max_size = 10
# Seconds to wait when acquiring a pooled connection before failing.
timeout_s = 10.0
# Close idle connections after this many seconds. Neon serverless suspends
# compute after ~300 s of inactivity; 240 s keeps us safely under that
# threshold so stale connections are dropped before the server kills them.
max_idle_s = 240.0

[rooms.db.guardrails]
# Prevent huge responses from drowning your LLM.
max_rows = 50
# Restrict queries to known hotel tables. Good safety belt.
allow_only_hotel_tables = true

# NOTE: statement_timeout and search_path are set at the database role level:
#   ALTER ROLE <role> SET statement_timeout = '10s';
#   ALTER ROLE <role> SET search_path = public;
# This ensures they apply correctly under PgBouncer transaction pooling.

[rooms.db.retry]
# Retries for transient connection errors like connection closed unexpectedly.
max_transient_retries = 3
# Small backoff (seconds) before retry.
transient_retry_backoff_s = 0.15
# WARNING: Retrying writes can cause duplicate effects if the write actually succeeded but connection died before you got the response.
retry_writes_on_transient_errors = false

# Local data ingestion settings for one-off loaders.
[load_data.information_redis]
# Folder containing the Redis ingestion pickle files.
# Specified from the same level as the blue_horizon package.
data_path = "data/pandas"

[load_data.rooms_pgsql]
# Folder containing the PostgreSQL ingestion pickle files.
# Specified from the same level as the blue_horizon package.
data_path = "data/pandas"
