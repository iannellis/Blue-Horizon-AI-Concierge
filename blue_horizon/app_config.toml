# Tunables for the Blue Horizon agents. Secrets come from environment variables.
# Timeouts are in seconds. See docs/guides/configuration.md.

[orchestration.llm]
# Model identifier passed to ChatOpenAI
model = "gpt-5.6-luna"
# Reasoning effort: "none", "minimal", "low", "medium", or "high"
reasoning_effort = "none"
# Per-request network timeout for the LLM client
timeout_s = 15.0
# Retry count for transient provider/network errors
max_retries = 2

[orchestration.orchestration]
# Initialization retry policy for dependency startup
init_retry_base_s = 2.0
init_retry_max_s = 10.0
# Wall-clock cap for the router node (wraps the router LLM call)
router_timeout_s = 30.0
# Wall-clock cap for the info node (wraps the info LLM call)
info_timeout_s = 60
# Wall-clock cap for the booking node (wraps the booking LLM call)
booking_timeout_s = 60
# Maximum concurrent LLM pipeline executions
llm_concurrency = 15
# Retry-After seconds on a 503 while not ready or the database is unreachable
unavailable_retry_after_s = 5.0

[orchestration.prompts]
# Folder (relative to blue_horizon package root) containing prompt files
folder = "system_prompts"
# Router system prompt filename within the prompts folder
orchestration_prompt_filename = "orchestration.txt"

[orchestration.messages]
# Shown when the router chooses "refuse"
refusal = "I'm sorry, I cannot help with that query. I can only provide information about the hotel and help with room bookings."
# Shown when a chat turn fails mid-flight
error = "Sorry - that request could not be completed. You can send it again."
# Shown when a booking turn fails because the database was unreachable
database_unavailable = "Sorry - the booking system could not be reached, so that request could not be completed. You can send it again."
# Shown while readiness is STARTING
unavailable = "The system is starting up and should be ready again shortly. No action is needed on your part."
# Shown while readiness is FAILED
failed = "Sorry - the system hit a problem that will not resolve on its own. Please check back later."

[info.retrieval]
# Candidates retrieved per source, and the most cards the agent presents
top_k = 4
# Cap on retrieved items passed to the LLM across all sources
max_context_items = 20
# Embedding dimensionality; must match the Redis index schema
vector_dims = 1536
# Maximum cached amenity/service retrievers per process
retriever_cache_max = 64

[info.embeddings]
# OpenAI embedding model used by LlamaIndex
model = "text-embedding-3-small"
# Batch size for embedding calls
batch_size = 64
# Network timeout for embedding requests
timeout_s = 20.0
# Max retries for embedding requests
max_retries = 2

[info.llm]
# Chat model used by ChatOpenAI
model = "gpt-5.6-luna"
# Reasoning effort
reasoning_effort = "medium"
# Network timeout for chat requests
timeout_s = 20.0
# Max retries for chat requests
max_retries = 2

[info.redis]
# Redis connection timeout
connect_timeout_s = 2.0
# Redis socket timeout
socket_timeout_s = 4.0
# Redis client health check interval
health_check_interval_s = 30
# Retry count for transient Redis failures
retry_max_retries = 2
# Base backoff for Redis retries
retry_backoff_base_s = 0.1
# Maximum backoff for Redis retries
retry_backoff_max_s = 1.0

[info.prompts]
# Folder (relative to blue_horizon package root) containing prompt files
folder = "system_prompts"
# Prompt filenames within the prompts folder (no paths)
system_prompt_filename = "information.txt"
parser_prompt_filename = "information_parser.txt"

[booking.llm]
# Chat model name
model = "gpt-5.6-luna"
# Reasoning effort
reasoning_effort = "medium"
# Network timeout for LLM requests
timeout_s = 20.0
# Max retries for LLM requests
max_retries = 2

[booking.prompts]
# Folder (relative to blue_horizon package root) containing prompt files
folder = "system_prompts"
# Prompt filename within the prompts folder
system_prompt_filename = "booking.txt"

[booking.agent]
# The default number of rooms to return to the user
top_k = 4

[booking.db.pool]
# Connections opened on demand only (min) and the pool ceiling (max)
min_size = 0
max_size = 10
# Seconds to wait when acquiring a pooled connection before failing
timeout_s = 10.0
# Close idle connections before Neon suspends compute
max_idle_s = 240.0
# Seconds a failed background connect keeps retrying before the pool gives up
reconnect_timeout_s = 30.0

[booking.db.guardrails]
# Maximum rows returned by one run_sql call
max_rows = 50
# Restrict queries to known hotel tables
allow_only_hotel_tables = true

[booking.db.retry]
# Retries for transient connection errors on the read-only run_sql pool
max_transient_retries = 3
# Backoff before each retry
transient_retry_backoff_s = 0.15

[booking.proposals]
# Seconds an unconfirmed proposal stays in the store before it is purged
ttl_s = 1800

[load_data.information_redis]
# Folder with the Redis ingestion pickles, relative to the repo root
data_path = "data/pandas"

[load_data.booking_pgsql]
# Folder with the PostgreSQL ingestion pickles, relative to the repo root
data_path = "data/pandas"
# Customers remapped to the dense customer_id range [1, N] and loaded first
seeded_customer_count = 15

[logging]
# Root log level for the API process
level = "INFO"
# Loggers kept at WARNING, since at INFO they log every outbound HTTP request
quiet_loggers = ["httpx", "httpcore", "openai"]
