# Non-secret configuration for the Rooms Agent.

[llm]
# Chat model name. Keep this cheap if you're serving lots of traffic.
model = "gpt-5-mini"

# 0.0 is best for deterministic SQL generation.
temperature = 0.0

# OpenAI reasoning effort hint (if supported by your model).
# Typical values: "low", "medium", "high"
reasoning_effort = "low"

# Network timeout for LLM requests (seconds).
timeout_s = 20.0

# Max retries for LLM requests.
max_retries = 2


[prompts]
# Folder relative to this Python file.
folder = "../system_prompts"

# Prompt template filename inside the folder.
filename = "rooms_sql_prompt.txt"


[agent]
# Your prompt likely references these.
dialect = "PostgreSQL"
top_k = 4


[db.pool]
# App-side pool. Even with Neon pooler, this provides sane backpressure.
min_size = 1
max_size = 10

# Seconds to wait when acquiring a pooled connection before failing.
timeout_s = 10.0


[db.guardrails]
# Prevent huge responses from drowning your LLM.
max_rows = 50

# Restrict queries to known hotel tables. Good safety belt.
allow_only_hotel_tables = true


[db.timeouts]
# Postgres statement timeout (ms). Prevents long-running queries.
# 0 disables statement timeout.
statement_timeout_ms = 10000


[db.retry]
# Retries for transient connection errors like:
# "SSL connection has been closed unexpectedly"
# Typically 1 is enough.
max_transient_retries = 1

# Small backoff (seconds) before retry.
transient_retry_backoff_s = 0.15

# WARNING: Retrying writes can cause duplicate effects if the write actually succeeded
# but the connection died before you got the response.
retry_writes_on_transient_errors = false