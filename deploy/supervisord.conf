[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
command=/bin/sh -c 'echo API_START $(date -Iseconds) $$; exec fastapi run blue_horizon/api/app.py --host 127.0.0.1 --port 8000'
directory=/app
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ui]
command=/bin/sh -c 'echo UI_START $(date -Iseconds) $$; exec streamlit run ui/app.py --server.port 7860 --server.address 0.0.0.0'
directory=/app
; Streamlit calls FastAPI directly inside the container — no round-trip through a proxy.
environment=PYTHONPATH="/app",BLUE_HORIZON_API_URL="http://127.0.0.1:8000"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
