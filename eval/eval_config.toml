[experiment]
# LangSmith dataset name to evaluate (required).
dataset_name = "BlueHorizonEval_case2"
# Prefix used when generating experiment names.
experiment_prefix = "hotel-agent-eval-case2"
# Optional run notes appended to experiment names.
run_notes = "Small dataset with just case 2"
# Maximum concurrent example evaluations.
max_concurrency = 10
# Base output directory for local evaluation artifacts.
output_dir = "eval/outputs"
# Whether to upload results to LangSmith.
upload_results = true
# Optional limit on dataset examples (empty runs full dataset).
limit = ""

[metadata]
# Git commit SHA to attach to LangSmith metadata (optional).
git_sha = ""
# Router model identifier to attach to LangSmith metadata (optional).
router_model = ""
# Judge model identifier to attach to LangSmith metadata (optional).
judge_model = ""
# Database schema version label to attach to LangSmith metadata (optional).
schema_version = ""

[evaluator_limits]
# Maximum characters per context snippet in evaluator outputs.
context_max_chars = 1200
# Maximum number of context snippets included in evaluator outputs.
context_max_items = 6
# Maximum characters from assistant messages in evaluator outputs.
assistant_max_chars = 1200
# Maximum characters from user messages in evaluator outputs.
user_max_chars = 800
# Max stored failures included in evaluator outputs for info expected filters.
info_filter_failures_max = 25
# Max stored failures included in evaluator outputs for required tool usage.
required_tool_failures_max = 25
# Maximum characters to keep when JSON-encoding evaluator detail values.
json_value_max = 4000
# Maximum characters to keep for large per-turn RAG detail JSON.
rag_per_turn_json_max = 8000
# Maximum number of injection tripwire hits to store.
tripwire_hits_max = 200

[rooms]
# Filesystem path to the pickled rooms datasets used by eval resets.
# Relative to level of "eval" directory.
data_path = "data/pandas"

[orchestration]
# Time in seconds to wait for OrchestrationManager readiness.
ready_timeout_s = 90.0

[schema_slots]
# Maximum active schemas (0 disables slot limiting).
max_active_schemas = 0
# Time in seconds before schema slots are considered stale.
stale_after_s = 1800
# Time in seconds to wait for a schema slot before failing.
wait_timeout_s = 300.0
# Poll interval in seconds while waiting for schema slots.
poll_interval_s = 1.0

[reset_pool]
# Maximum number of connections in the schema reset pool.
max_size = 4
# Minimum number of connections in the schema reset pool.
min_size = 1

[judge]
# Judge model name used for rubric grading (Gemini model unless code edited).
model = "gemini-2.5-flash"

[ragas]
# Maximum number of turns to score with Ragas.
turns_max = 10
# Maximum number of retrieved contexts per turn.
contexts_max = 4
# Maximum characters per retrieved context.
context_chars = 5000
# Maximum characters for the user query.
query_chars = 5000
# Maximum characters for the assistant response.
response_chars = 5000
# Maximum characters for reference answers.
reference_chars = 5000
# Gemini model used for Ragas LLM scoring.
llm_model = "gemini-2.5-flash"
# Maximum output tokens for the Ragas LLM.
llm_max_tokens = 2048
# Gemini model used for Ragas embeddings.
embedding_model = "gemini-embedding-001"

[stress]
# Optional schema name override for stress runs (empty uses timestamp default).
schema = ""
# Number of concurrent simulated users.
users = 50
# Number of operations per user.
ops_per_user = 20
# Maximum number of users allowed to run concurrently.
max_concurrency = 50
# Baseline data directory for stress schema resets.
baseline_data_path = "data/pandas"
# Base output directory for stress artifacts.
output_dir = "eval/outputs"
# Nights per booking when generating targets.
stay_nights = 2
# Number of available targets to precompute.
num_targets = 10
# Size of the hot contention target subset.
hot_target_count = 5
# Search start date for availability targets (YYYY-MM-DD).
start_date = "2025-02-01"
# Search horizon in days from the start date.
horizon_days = 60
# Maximum size of the stress-test database pool.
pool_max = 10
