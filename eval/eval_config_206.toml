[experiment]
# LangSmith dataset name to evaluate (required).
dataset_name = "BlueHorizonEval_206"
# Prefix used when generating experiment names.
experiment_prefix = "hotel-agent-eval-206"
# Optional run notes appended to experiment names.
run_notes = "Full dataset with 206 cases"
# Maximum concurrent example evaluations.
max_concurrency = 10
# Base output directory for local evaluation artifacts.
output_dir = "eval/outputs"
# Directory for evaluation logs.
log_dir = "eval/logs"
# Whether to upload results to LangSmith.
upload_results = true
# Optional limit on dataset examples (empty runs full dataset).
limit = ""

[evaluator_limits]
# Maximum characters per context snippet passed to the judge LLM.
context_max_chars = 1200
# Maximum number of context snippets passed to the judge LLM per turn.
context_max_items = 20
# Maximum characters from assistant messages passed to the judge LLM.
assistant_max_chars = 2000
# Maximum characters from user messages passed to the judge LLM.
user_max_chars = 1200
# Max stored failures included in evaluator outputs for info expected filters.
info_filter_failures_max = 25
# Max stored failures included in evaluator outputs for required tool usage.
required_tool_failures_max = 25
# Maximum characters to keep when JSON-encoding evaluator detail values.
json_value_max = 4000
# Maximum characters to keep for large per-turn RAG detail JSON.
rag_per_turn_json_max = 8000
# Maximum number of injection tripwire hits to store.
tripwire_hits_max = 200

[neon]
# Neon project ID (visible in the console URL: console.neon.tech/app/projects/<project_id>).
project_id = "orange-art-94985227"
# Neon branch name to restore to its parent baseline before each eval run.
branch_name = "Development"
# Number of retry attempts when the branch is locked (HTTP 423).
lock_retry_attempts = 8
# Seconds to wait between lock retry attempts.
lock_retry_delay_s = 5.0
# Seconds to wait between polls of a restore operation's status.
operation_poll_interval_s = 2.0
# Maximum seconds to wait for a restore operation to finish before giving up.
operation_poll_timeout_s = 120.0

[orchestration]
# Time in seconds to wait for OrchestrationManager readiness.
ready_timeout_s = 90.0

[judge]
# Judge model name used for rubric grading (Gemini model unless code edited).
model = "gemini-3.5-flash-lite"
# Maximum cards the information agent presents per response (matches info.retrieval.top_k).
# The judge uses this to avoid penalising the agent for omitting additional valid options.
info_cards_max = 4

[ragas]
# Maximum number of turns to score with Ragas.
turns_max = 10
# Maximum number of retrieved contexts per turn.
contexts_max = 20
# Maximum characters per retrieved context.
context_chars = 1200
# Maximum characters for the user query.
query_chars = 1200
# Maximum characters for the assistant response.
response_chars = 2000
# Maximum characters for reference answers.
reference_chars = 2000
# Gemini model used for Ragas LLM scoring.
llm_model = "gemini-3.5-flash-lite"
# Maximum output tokens for the Ragas LLM.
llm_max_tokens = 2048
# Gemini model used for Ragas embeddings.
embedding_model = "gemini-embedding-2"
# Replace the stock Ragas context-precision prompt with one
# that counts a chunk as useful when it answers any one clause of a multi-part
# question (see eval/evaluators/_rag_prompts.py).
custom_precision_prompt = true
# Reference text marking a turn whose expected answer is "nothing matched".
# Context precision is skipped for turns whose reference is only this sentinel:
# a bare refusal has no content for a retrieved chunk to support, so the judge's
# verdicts there measure nothing. Set to "" to score those turns anyway.
no_match_reference = "I could not find exactly what you requested"

