[project]
name = "blue-horizon"
version = "0.1.0"
description = ""
authors = [
    {name = "Ian Ellis"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "llama-index (>=0.14.6,<0.15.0)",
    "llama-index-vector-stores-redis (>=0.6.1,<0.7.0)",
    "llama-index-readers-file (>=0.5.4,<0.6.0)",
