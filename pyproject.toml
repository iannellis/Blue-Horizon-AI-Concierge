[project]
name = "blue-horizon"
version = "0.1.0"
description = ""
authors = [
    {name = "Ian Ellis"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "llama-index (>=0.14.6,<1.0.0)",
    "llama-index-vector-stores-redis (>=0.6.1,<1.0.0)",
    "redisvl (>=0.4.1,<1.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "psycopg[binary, pool] (>=3.2.12,<4.0.0)",
    "langchain (>=1.1.0,<2.0.0)",
    "langchain-openai (>=1.1.0,<2.0.0)",
    "langgraph (>=1.0.4,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "fastapi[standard] (>=0.129.0)",
    "tenacity (>=8.2.0,<10.0.0)",
    "sqlglot (>=30.0.3,<31.0.0)",
    "pandera[pandas] (>=0.30.1,<1.0.0)",
]

[dependency-groups]
ui = [
    "streamlit[auth] (>=1.40.0)",
    "httpx (>=0.27.0)",
]
eval = [
    "jsonref (>=1.1.0,<2.0.0)",  # Should be somebody's dependency
    "langchain-google-genai (>=4.2.0,<5.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "ragas (==0.4.3)",  # fixed so tests don't change due to version changes
    "langchain-community (>=0.4.1,<0.4.2)",  # 0.4.2 drops chat_models.vertexai, which ragas==0.4.3 still imports
    # google-genai 1.72.0 added gemini-embedding-2-specific handling to
    # Models.embed_content() that runs a bare list[str] through the
    # generate_content content-normalizer, collapsing it into one multi-part
    # Content before the batch-embed path sees it -- so embed_content(
    # contents=[N strings]) silently returns 1 embedding instead of N for
    # this model family specifically (text-embedding-004 and
    # gemini-embedding-001 are unaffected). ragas==0.4.3's AnswerRelevancy
    # reshapes the result without validating the count, so it silently
    # corrupts the embedding matrix instead of raising -- zeroing that
    # metric. Pin below the 1.72.0 break until ragas is re-verified against
    # a newer release.
    "google-genai (>=1.65.0,<1.72.0)",
]
notebook = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "openai (>=2.7.2,<4.0.0)",
    "llama-index-llms-openai (>=0.6.6,<1.0.0)",
]
lint = [
    "pyright>=1.1.411",
    "ruff (>=0.14.5,<1.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "db_integration: needs a real Postgres reachable via PGSQL_RW_DB_URL/PGSQL_RO_DB_URL with the bh_agent_rw/bh_agent_ro roles granted (see blue_horizon/load_data/regrant_booking_agent_role.sql); tests/api/test_app.py additionally needs REDIS_URL and OPENAI_API_KEY to start the real app. Excluded from the default run; see .github/workflows/ci.yml's db-integration-tests job.",
]
